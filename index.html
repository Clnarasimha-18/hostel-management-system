<!DOCTYPE html>
<html>
<head>
    <h1 class="main-title">🏠 Web-Based Hostel Management System</h1>
    <link rel="stylesheet" href="style.css">
</head>
<body>


<div class="login-container">

    <!-- ADMIN LOGIN -->
    <div class="login-box">
        <h2>Admin Login</h2>
        <input id="adminUser" placeholder="Username">
        <input id="adminPass" type="password" placeholder="Password">
        <button onclick="adminLogin()">Login</button>
        <p id="adminError" class="error"></p>
    </div>

    <!-- STUDENT LOGIN -->
    <div class="login-box">
        <h2>Student Login</h2>
        <input id="studentUser" placeholder="Student ID">
        <input id="studentPass" type="password" placeholder="Password">
        <button onclick="studentLogin()">Login</button>
        <p id="studentError" class="error"></p>
    </div>

</div>

<script src="admin.js"></script>
<script src="student.js"></script>

</body>
</html>
