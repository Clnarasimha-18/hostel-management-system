<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<button onclick="logoutStudent()">Logout</button>

<h1>Student Dashboard</h1>

<div class="card">
    <h2>Student Details</h2>
    <div id="profile"></div>
</div>

<div class="card">
    <h2>Room Details</h2>
    <div id="roomDetails"></div>
</div>

<div class="card">
    <h2>Fee Details</h2>
    <div id="feeDetails"></div>
</div>

<div class="card">
    <h2>My Complaints</h2>
    <div id="complaints"></div>
</div>

<div class="card">
    <h2>Raise Complaint</h2>
    <input id="newComplaint" placeholder="Enter complaint">
    <button onclick="addComplaint()">Submit</button>
</div>

<script src="student.js"></script>
</body>
</html>
